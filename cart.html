<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - ShopIno Electronics</title>
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/cart.css">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div class="container">
        <div class="sidebar" id="dynamic-sidebar">
            <!-- Sidebar will be dynamically inserted here -->
        </div>
        <div class="main-content">
            <div id="auth-container" class="auth-container">
                <div class="auth-forms-wrapper">
                    <div class="auth-form login-form">
                        <h2>Welcome Back</h2>
                        <p>Please login to access your cart</p>
                        <form id="login-form-element">
                            <div class="input-group">
                                <input type="email" id="login-email" required placeholder="Enter your email">
                                <label for="login-email">Email</label>
                            </div>
                            <div class="input-group">
                                <input type="password" id="login-password" required placeholder="Enter your password">
                                <label for="login-password">Password</label>
                            </div>
                            <button type="submit" class="auth-btn"
                                onclick="console.log('Login button clicked')">Login</button>
                        </form>
                        <p class="switch-form">Don't have an account? <a href="#" id="switch-to-register">Register</a>
                        </p>
                    </div>
                    <div class="auth-form register-form">
                        <h2>Create an Account</h2>
                        <p>Please fill in your details to register</p>
                        <form id="register-form-element">
                            <div class="input-group">
                                <input type="text" id="register-name" required placeholder="Full Name">
                                <label for="register-name">Full Name</label>
                            </div>
                            <div class="input-group">
                                <input type="email" id="register-email" required placeholder="Enter your email">
                                <label for="register-email">Email</label>
                            </div>
                            <div class="input-group">
                                <input type="password" id="register-password" required placeholder="Create a password">
                                <label for="register-password">Password</label>
                            </div>
                            <div class="input-group">
                                <input type="tel" id="register-phone" required placeholder="Phone Number">
                                <label for="register-phone">Phone Number</label>
                            </div>
                            <div class="input-group">
                                <input type="text" id="register-address" required placeholder="Address">
                                <label for="register-address">Address</label>
                            </div>
                            <button type="submit" class="auth-btn"
                                onclick="console.log('Register button clicked')">Register</button>
                        </form>
                        <p class="switch-form">Already have an account? <a href="#" id="switch-to-login">Login</a></p>
                    </div>
                </div>
            </div>
            <div id="cart-content" class="hidden">
                <div id="user-topbar" class="hidden">
                    <span id="user-email"></span>
                    <button id="logout-btn">Logout</button>
                </div>
                <h2>Your Cart</h2>
                <div id="cart-container">
                    <div id="cart-items" class="catalogue-grid"></div>
                    <div id="cart-summary">
                        <p>Total: $<span id="cart-total">0.00</span></p>
                        <button id="checkout-btn" onclick="handleCheckout()">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/cart.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/sidebar.js"></script>
</body>

</html>
