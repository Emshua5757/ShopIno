<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopIno Electronics - Shop</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/product.css">
</head>

<body>
    <div class="container">
        <div class="sidebar" id="dynamic-sidebar">
            <!-- Sidebar will be dynamically inserted here -->
        </div>
        <div class="main-content">
            <div class="selected-product">
                <div class="product-image-container">
                    <img id="main-product-image" src="" alt="Selected Product">
                </div>
                <div class="product-details">
                    <h2 id="main-product-name"></h2>
                    <p id="main-product-price" class="price"></p>
                    <p id="main-product-description"></p>
                    <div class="product-actions">
                        <div class="quantity-selector">
                            <button class="quantity-btn minus"
                                onclick="document.getElementById('quantity-input').value = Math.max(1, parseInt(document.getElementById('quantity-input').value) - 1)">-</button>
                            <input type="number" value="1" min="1" max="99" class="quantity-input" id="quantity-input">
                            <button class="quantity-btn plus"
                                onclick="document.getElementById('quantity-input').value = Math.min(99, parseInt(document.getElementById('quantity-input').value) + 1)">+</button>
                        </div>
                        <button id="add-to-cart"
                            onclick="addToCartFirebase(JSON.parse(localStorage.getItem('selectedProduct')), parseInt(document.getElementById('quantity-input').value) || 1)">Add
                            to Cart</button>
                        <button id="add-to-favorites" onclick="addToFavorites()">Add to Favorites</button>
                    </div>
                </div>
            </div>
            <div class="catalogue-container">
                <h1>Product Catalogue</h1>
                <input type="text" id="search-input" placeholder="Search for products..." oninput="filterProducts()">
                <div class="catalogue-grid">
                    <!-- Products will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/favorites.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script>
        function filterProducts() {
            const searchInput = document.getElementById('search-input').value.toLowerCase();
            const productItems = document.querySelectorAll('.product-item');

            productItems.forEach(item => {
                const productName = item.querySelector('p strong').textContent.toLowerCase();
                if (productName.includes(searchInput)) {
                    item.style.display = 'block'; // Show matching product
                } else {
                    item.style.display = 'none'; // Hide non-matching product but it is still in the block jsut hidden
                }
            });
        }
    </script>
</body>

</html>
